<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasrah Games - منصة الألعاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d4d;
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
        }
        #searchBar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
            outline: none;
            border: 1px solid #333;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 10px;
            border: 1px solid #222;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 77, 77, 0.2);
            border-color: var(--primary);
        }
        .game-thumb {
            width: 100%;
            aspect-ratio: 1/1;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #444;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        .game-thumb.loaded {
            opacity: 1;
        }
        .game-title {
            padding: 10px;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 90%;
        }
        #loader {
            width: 100%;
            margin: 20px 0;
            text-align: center;
            padding: 20px;
            color: var(--primary);
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>KASRAH GAMES</h1>
    <p id="gameCount">استكشف ألعابنا المجانية</p>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="ابحث عن لعبتك المفضلة..." onkeyup="filterGames()">
    </div>
</header>

<div class="games-grid" id="gamesGrid"></div>
<div id="loader" style="display:none;">جاري تحميل المزيد من الألعاب...</div>

<script>
    let allGames = [];
    let filteredGames = [];
    let currentIndex = 0;
    const gamesPerPage = 24;
    const gamesGrid = document.getElementById('gamesGrid');
    const loader = document.getElementById('loader');

    // تحميل البيانات من ملف JSON
    async function fetchGames() {
        try {
            const response = await fetch('games.json');
            allGames = await response.json();
            filteredGames = [...allGames];
            document.getElementById('gameCount').textContent = `استكشف أكثر من ${allGames.length} لعبة مجانية`;
            loadMoreGames();
        } catch (error) {
            console.error('Error loading games:', error);
        }
    }

    function createGameCard(game) {
        const a = document.createElement('a');
        a.href = game.href;
        a.className = 'game-card';
        a.setAttribute('data-name', game.name);
        
        const thumb = document.createElement('div');
        thumb.className = 'game-thumb';
        thumb.dataset.src = game.thumb;
        
        const title = document.createElement('div');
        title.className = 'game-title';
        title.textContent = game.title;
        
        a.appendChild(thumb);
        a.appendChild(title);
        return a;
    }

    const DEFAULT_THUMB = 'https://via.placeholder.com/150/1a1a1a/ff4d4d?text=Game';

    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const thumb = entry.target;
                const src = thumb.dataset.src;
                const img = new Image();
                
                img.onload = () => {
                    thumb.style.backgroundImage = `url('${src}')`;
                    thumb.classList.add('loaded');
                };
                
                img.onerror = () => {
                    thumb.style.backgroundImage = `url('${DEFAULT_THUMB}')`;
                    thumb.classList.add('loaded');
                };
                
                img.src = src;
                observer.unobserve(thumb);
            }
        });
    }, { rootMargin: '100px' });

    function loadMoreGames() {
        if (currentIndex >= filteredGames.length) return;
        
        loader.style.display = 'block';
        const nextBatch = filteredGames.slice(currentIndex, currentIndex + gamesPerPage);
        
        nextBatch.forEach(game => {
            const card = createGameCard(game);
            gamesGrid.appendChild(card);
            imageObserver.observe(card.querySelector('.game-thumb'));
        });
        
        currentIndex += gamesPerPage;
        loader.style.display = 'none';
    }

    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
            loadMoreGames();
        }
    });

    function filterGames() {
        const searchTerm = document.getElementById('searchBar').value.toLowerCase();
        filteredGames = allGames.filter(game => 
            game.name.toLowerCase().includes(searchTerm) || 
            game.title.toLowerCase().includes(searchTerm)
        );
        
        gamesGrid.innerHTML = '';
        currentIndex = 0;
        loadMoreGames();
    }

    // بدء التشغيل
    fetchGames();
</script>

</body>
</html>
