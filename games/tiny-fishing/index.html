        <script>
        /**
         * Kasrah SDK Integration for Tiny Fishing
         * =========================================
         * تهيئة اللعبة مع Kasrah SDK بدلاً من Poki SDK
         * 
         * المميزات المفعّلة:
         * - الإعلانات البينية (Interstitial Ads)
         * - إعلانات المكافأة (Rewarded Ads)  
         * - إعلانات البانر (Banner Ads)
         * - الحفظ السحابي (Cloud Save)
         * - تتبع الأحداث (Analytics)
         */

        // تعطيل POKI_INIT القديمة وتجاهلها
        // الجسر kasrah-poki-bridge.js يتولى التهيئة تلقائياً
        window.POKI_INIT = function() {
          console.log('[Kasrah] POKI_INIT intercepted - Kasrah Bridge handles initialization');
          // لا حاجة لأي شيء هنا - الجسر يتولى كل شيء
        };

        // تأكد من تشغيل اللعبة عند تحميل الصفحة
        // الجسر يتولى استدعاء GameMaker_Init بعد تهيئة SDK
        window.onload = function() {
          console.log('[Kasrah] Page loaded - Kasrah Bridge will handle game initialization');
          // الجسر يستمع لـ KasrahSDK ويهيئ اللعبة تلقائياً
        };

        /**
         * حفظ النتيجة العالية في السحابة
         * يمكن استدعاؤها من أي مكان في اللعبة
         */
        window.kasrahSaveHighScore = function(score) {
          if (window.KasrahSaveGameData) {
            KasrahSaveGameData({
              highScore: score,
              lastPlayed: Date.now(),
              gameVersion: '1.0'
            });
          }
        };

        /**
         * عرض إعلان مكافأة عند طلب اللاعب جواهر مجانية
         * يمكن ربطها بزر "احصل على جواهر مجاناً" في اللعبة
         */
        window.kasrahShowRewardedForGems = function(onReward) {
          if (window.KasrahSDK && typeof KasrahSDK.showRewarded === 'function') {
            KasrahSDK.showRewarded({
              onReward: function() {
                console.log('[Kasrah] Gems reward earned!');
                if (onReward) onReward();
              },
              onError: function(err) {
                console.warn('[Kasrah] Rewarded ad error:', err);
              }
            });
          }
        };

        </script>
