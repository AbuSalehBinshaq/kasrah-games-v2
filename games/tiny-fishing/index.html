<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="PRAGMA" content="NO-CACHE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <title>Tiny Fishing</title>
    <style>
        body {
            background: #000;
            color: #cccccc;
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        canvas {
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }

        div.gm4html5_div_class {
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        div.gm4html5_login_class {
            display: none;
        }

        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="./patch/cloner-v27.js"></script>
    <script>
        // ============================================================
        // نظام اعتراض التخزين لضمان حفظ التقدم مع Kasrah SDK
        // ============================================================
        (function() {
            const GAME_KEY_PREFIX = "Tiny Fishing.0.9dffcbea-afac-4655-8dbb-518fc558bac4.";
            
            // تخزين الدوال الأصلية
            const originalSetItem = window.localStorage.setItem;
            
            // اعتراض setItem
            window.localStorage.setItem = function(key, value) {
                // تنفيذ الحفظ الأصلي في localStorage
                originalSetItem.apply(this, arguments);
                
                // إذا كان المفتاح ينتمي للعبة، نقوم بمزامنته مع Kasrah SDK
                if (key.startsWith(GAME_KEY_PREFIX)) {
                    console.log("[Kasrah Fix] Intercepted save for:", key);
                    if (window.KasrahSaveGameData) {
                        // جلب كل بيانات اللعبة من localStorage لإرسالها ككائن واحد
                        const allData = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const k = localStorage.key(i);
                            if (k.startsWith(GAME_KEY_PREFIX)) {
                                allData[k] = localStorage.getItem(k);
                            }
                        }
                        window.KasrahSaveGameData(allData);
                    }
                }
            };

            // محاولة استعادة البيانات عند التحميل
            window.addEventListener('load', function() {
                if (window.KasrahLoadGameData) {
                    window.KasrahLoadGameData(function(cloudData) {
                        if (cloudData && typeof cloudData === 'object') {
                            console.log("[Kasrah Fix] Restoring data from cloud...");
                            for (let key in cloudData) {
                                originalSetItem.call(window.localStorage, key, cloudData[key]);
                            }
                        }
                    });
                }
            });
        })();
    </script>
    <script src="https://kasrah-sdk.onrender.com/sdk/kasrah-sdk.js"></script>
</head>
<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="650" height="1050">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>
    <script type="text/javascript" src="html5game/kasrah-poki-bridge.js"></script>
    <script type="text/javascript" src="html5game/TinyFishing.js"></script>
    <script src="/sdk/kasrah-sdk.js"></script>
</body>
</html>
