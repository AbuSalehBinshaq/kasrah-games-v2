<script src="/sdk/kasrah-sdk.js"></script>
<script>
    // ربط اللعبة بالـ SDK
    const gameWrapper = document.getElementById('game-wrapper');
    
    // 1. تهيئة الـ SDK
    KasrahSDK.manualInit({
        debugMode: true,
        adFrequency: 2 // إعلان كل مرتين يتم فيها طلب إعلان (مثلاً عند الخسارة أو البدء)
    });

    // 2. إيقاف اللعبة عند ظهور الإعلان
    KasrahSDK.on('adStarted', () => {
        console.log("Kasrah SDK: Ad started, pausing game input.");
        gameWrapper.classList.add('kasrah-paused');
        // بما أن اللعبة تعتمد على keydown، سنقوم بمنع التفاعل عبر CSS pointer-events
    });

    // 3. استئناف اللعبة عند انتهاء الإعلان
    KasrahSDK.on('adFinished', () => {
        console.log("Kasrah SDK: Ad finished, resuming game input.");
        gameWrapper.classList.remove('kasrah-paused');
    });

    // 4. تتبع أحداث اللعبة (اختياري)
    document.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            // يمكننا تتبع عدد الحركات مثلاً
        }
    });
</script>
