<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Drift Boss - Kasrah Games</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* تحسين مظهر اللعبة وقت الإعلان */
        #game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div id="game-overlay"></div>
    <iframe id="game-frame" src="https://driftboss.ubg235.com/"></iframe>

    <script src="/sdk/kasrah-sdk.js"></script>
    <script>
        const overlay = document.getElementById('game-overlay');
        
        // تهيئة الـ SDK
        KasrahSDK.manualInit({
            debugMode: true,
            adFrequency: 2
        });

        // بما أننا نستخدم iframe خارجي، سنقوم بتغطية اللعبة وقت الإعلان
        KasrahSDK.on('adStarted', () => {
            console.log("Kasrah SDK: Ad started, covering iframe.");
            overlay.style.display = 'block';
        });

        KasrahSDK.on('adFinished', () => {
            console.log("Kasrah SDK: Ad finished, revealing iframe.");
            overlay.style.display = 'none';
        });
    </script>
</body>
</html>
