<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Drift Boss - Kasrah Games</title>
    <link rel="stylesheet" href="game.css">
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #game-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        /* تحسين مظهر اللعبة مع الـ SDK */
        .kasrah-paused {
            pointer-events: none !important;
            filter: blur(3px) grayscale(0.5);
            transition: filter 0.3s;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- حاويات اللعبة المطلوبة من ملف game.css -->
        <div id="game"></div>
        <canvas id="canvas"></canvas>
        <div id="webgl"></div>
    </div>

    <!-- استدعاء ملفات اللعبة المحلية -->
    <script src="game.js"></script>
    
    <!-- استدعاء الـ SDK -->
    <script src="/sdk/kasrah-sdk.js"></script>
    
    <script>
        // ربط اللعبة بالـ SDK
        const gameContainer = document.getElementById('game-container');
        
        // 1. تهيئة الـ SDK
        KasrahSDK.manualInit({
            debugMode: true,
            adFrequency: 3,
            autoPlayDelay: 4000 // بدء اللعبة بعد 4 ثواني
        });

        // 2. نظام الأحداث (Events) للتحكم في اللعبة
        KasrahSDK.on('adStarted', () => {
            console.log("Kasrah SDK: Ad started, pausing Drift Boss.");
            gameContainer.classList.add('kasrah-paused');
            
            // محاولة إيقاف الصوت برمجياً إذا كانت اللعبة تدعم ذلك
            if (window.ig && window.ig.music) {
                window.ig.music.pause();
            }
        });

        KasrahSDK.on('adFinished', () => {
            console.log("Kasrah SDK: Ad finished, resuming Drift Boss.");
            gameContainer.classList.remove('kasrah-paused');
            
            // إعادة تشغيل الصوت
            if (window.ig && window.ig.music) {
                window.ig.music.play();
            }
        });

        KasrahSDK.on('gameStart', () => {
            console.log("Kasrah SDK: Splash screen closed, game ready.");
        });

        // تتبع النقاط (اختياري - يحتاج لمعرفة المتغير الداخلي للعبة)
        // يمكننا إضافة مستمع للحركات إذا أردنا تتبع نشاط اللاعب
    </script>
</body>
</html>
