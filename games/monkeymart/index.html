<!doctype html>
<html lang="en">
 <head> 
  <meta charset="utf-8"> 
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no"> 
  <meta name="apple-mobile-web-app-capable" content="yes"> 
  <title>Monkey Mart - Kasrah Games</title> 
  <style type="text/css">
	body { position: fixed; margin:0; padding:0; background-color: #00BB61; }
	.canvas-app-container { width: 100%; height: 100%; position: absolute; align-items: center; justify-content: center; overflow: hidden; background: #00BB61; }
	#canvas { outline: none; border: 0; width: 100%; vertical-align: bottom; }
	#canvas-container { position: relative; }
	.canvas-app-canvas { background-repeat: no-repeat; background-position: center; background-size: cover; background-image: url("bg_loading.png"); }
	#kasrah-banner-top { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 1000; display: none; }
	#kasrah-banner-bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 1000; display: none; }
  </style> 
 </head> 
 <body> 
  <div id="kasrah-banner-top"></div>
  <div id="app-container" class="canvas-app-container"> 
   <div id="canvas-container" class="canvas-app-canvas-container"> 
    <canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="960" height="640"></canvas> 
   </div> 
   <div id="progress-bar-root" style="position: absolute; bottom: 16%; left: 50%; visibility: hidden; z-index: 4;"> 
    <img id="progress-bar-bg" src="load_bar_bg.png"> 
    <img id="progress-bar-fg" src="load_bar_fg.png" style="position:absolute; clip: rect(0px,0px,0px,0px);"> 
   </div> 
  </div> 
  <div id="kasrah-banner-bottom"></div>

  <script id="engine-loader" type="text/javascript" src="dmloader.js"></script> 
  <script id="engine-setup" type="text/javascript">
	var extra_params = {
		archive_location_filter: function( path ) { return ("archive" + path + ""); },
		engine_arguments: ["--verify-graphics-calls=false",],
		custom_heap_size: 134217728,
		full_screen_container: "#canvas-container",
		disable_context_menu: true
	}
	Module['INITIAL_MEMORY'] = extra_params.custom_heap_size;
	Module["locateFile"] = function(path, scriptDirectory) {
		if (path == "dmengine.wasm" || path == "dmengine_release.wasm" || path == "dmengine_headless.wasm") { path = "MonkeyMart.wasm"; }
		return scriptDirectory + path;
	};

	var originalRuntimeInit = Module['onRuntimeInitialized'];
	Module['onRuntimeInitialized'] = function() {
		if(originalRuntimeInit) originalRuntimeInit();
		Module.runApp("canvas", extra_params);
		// Load SDK after game starts
		setTimeout(loadKasrahSDK, 3000);
	};

	function resize_game_canvas() {
		var app_container = document.getElementById('app-container');
		var game_canvas = document.getElementById('canvas');
		var progress_bar_root = document.getElementById('progress-bar-root');
		var progress_bar_fg = document.getElementById('progress-bar-fg');
		var progress_bar_bg = document.getElementById('progress-bar-bg');
		var width = window.innerWidth;
		var height = window.innerHeight;
		app_container.style.width = width + "px";
		app_container.style.height = height + "px";
		game_canvas.width = width;
		game_canvas.height = height;
		var bar_h = width < height ? width:height;
		progress_bar_bg.width = Math.min(Math.ceil(bar_h * 0.06 * 300/24),width * 0.8);
		progress_bar_bg.style.marginLeft = - progress_bar_bg.width/2 + "px";
		progress_bar_fg.width =  Math.ceil(progress_bar_bg.width * 1);
		progress_bar_fg.style.marginLeft = -progress_bar_bg.width/2 - progress_bar_fg.width/2 + "px";
		progress_bar_root.style.bottom = Math.ceil(height*0.08) + "px";
	}
	window.addEventListener('resize', resize_game_canvas, false);
	resize_game_canvas();

	// Kasrah SDK Integration
	var kasrahSDK = null;
	function loadKasrahSDK() {
		var s = document.createElement('script');
		s.src = "https://kasrah-sdk.onrender.com/sdk/kasrah-sdk.js";
		s.onload = async function() {
			try {
				const success = await KasrahSDK.init({
					gameId: 'monkeymart',
					callbacks: {
						onAdStart: function() { if(Module.pauseMainLoop) Module.pauseMainLoop(); },
						onAdComplete: function() { if(Module.resumeMainLoop) Module.resumeMainLoop(); }
					}
				});
				if (success) {
					kasrahSDK = KasrahSDK;
					console.log('[Kasrah] SDK Ready');
					kasrahSDK.fireEvent('gameplayStart', { game: 'monkeymart' });
					// Show Banners
					const top = document.getElementById('kasrah-banner-top');
					if(top) { top.style.display='block'; kasrahSDK.requestBanner('kasrah-banner-top', '728x90'); }
					const bottom = document.getElementById('kasrah-banner-bottom');
					if(bottom) { bottom.style.display='block'; kasrahSDK.requestBanner('kasrah-banner-bottom', '320x50'); }
				}
			} catch(e) { console.error('[Kasrah] Init Error', e); }
		};
		document.head.appendChild(s);
	}

	window.KasrahGameHooks = {
		onLevelComplete: function(d) { if(kasrahSDK) kasrahSDK.saveData(d); },
		onGameOver: function(d) { if(kasrahSDK) { kasrahSDK.saveData(d); kasrahSDK.showInterstitial(); } },
		showInterstitialAd: function(cb) { if(kasrahSDK) kasrahSDK.showInterstitial({onComplete:cb, onError:cb}); else if(cb) cb(); },
		showRewardedAd: function(r, e) { if(kasrahSDK) kasrahSDK.showRewarded({onReward:r, onError:e}); else if(e) e(); }
	};
  </script> 
  <script id="engine-start" type="text/javascript">
	Progress.updateProgress = function(percentage) {
		var fg = document.getElementById('progress-bar-fg');
		fg.style.clip="rect(0px,"  + fg.width * percentage/100 + "px,"  + fg.height+"px," + "0px)";
		if(isNaN(percentage)) document.getElementById('progress-bar-root').style.visibility = "hidden";
	};
	Progress.addProgress = function (){ document.getElementById('progress-bar-root').style.visibility = "visible"; };
	Progress.removeProgress = function () { document.getElementById('progress-bar-root').style.visibility = "hidden"; Module.canvas.style.background = ""; };
	EngineLoader.load("canvas", "MonkeyMart");
  </script> 
 </body>
</html>
