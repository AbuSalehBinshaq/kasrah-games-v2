<!doctype html>
<html lang="en">
 <head> 
  <meta charset="utf-8"> 
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no"> 
  <meta name="apple-mobile-web-app-capable" content="yes"> 
  <title>Monkey Mart - Kasrah Games</title> 
  <style type="text/css">
	/* Disable user selection to avoid strange bug in Chrome on Windows */
	body {
		position: fixed;
		margin:0;
		padding:0;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.canvas-app-container:-webkit-full-screen {
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}

	#canvas-container {
		position: relative;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);
		-moz-outline-style: none;
	}

	div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}

	.banner-styleBottom {
		margin: 0 auto;
		position: fixed;
		bottom: 0;
		display: block;
		left: 50%;
		transform: translateX(-50%);
	}

	.banner-styleTop {
		margin: 0 auto;
		position: fixed;
		top: 0;
		display: block;
		left: 50%;
		transform: translateX(-50%);
	}

	.canvas-app-progress {
		position: absolute;
		background-color: #0A8A40;
		height: 30px;
		margin-top: -30px;
		width: 100%;
	}

	.canvas-app-progress-bar {
		font-size: 12px;
		height: 30px;
		color: rgb(255, 255, 255);
		background-color: #FFE333;
		text-align: center;
		line-height: 20px;
	}

	.link, .button {
		font-family: sans-serif;
		font-size: 14px;
		font-weight: normal;
		font-style: normal;
		font-stretch: normal;
		line-height: normal;
		letter-spacing: 0px;
		padding-top: 12px;
	}

	.buttons-background {
		background-color: #ffffff;
		width: 100%;
		height: 42px;
	}

	body {
		background-color: #00BB61;
	}

	.canvas-app-container {
		background: #00BB61;
	}

	.canvas-app-canvas {
		background-repeat: no-repeat;
		background-position: center;
		background-position: top;
		background-size: cover;
		background-image: url("bg_loading.png");
	}

	/* Kasrah SDK Banner Containers */
	#kasrah-banner-top {
		position: fixed;
		top: 0;
		left: 50%;
		transform: translateX(-50%);
		z-index: 1000;
		display: none;
	}

	#kasrah-banner-bottom {
		position: fixed;
		bottom: 0;
		left: 50%;
		transform: translateX(-50%);
		z-index: 1000;
		display: none;
	}
  </style>
  <script src="patch/js/poki-sdk.js"></script>
 </head> 
 <body>
  <!-- Kasrah SDK Banner Ads -->
  <div id="kasrah-banner-top"></div>

  <div id="app-container" class="canvas-app-container"> 
   <div id="canvas-container" class="canvas-app-canvas-container"> 
    <canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="960" height="640"></canvas> 
   </div> 
   <div class="buttons-background"> 
   </div> 
   <!-- center and anchor to bottom of page --> 
   <div id="progress-bar-root" style="position: absolute; bottom: 16%; left: 50%; visibility: hidden; z-index: 4;"> 
    <img id="progress-bar-bg" src="load_bar_bg.png"> 
    <img id="progress-bar-fg" src="load_bar_fg.png" style="position:absolute; clip: rect(0px,0px,0px,0px);"> 
   </div> 
  </div>

  <!-- Kasrah SDK Banner Bottom -->
  <div id="kasrah-banner-bottom"></div>

  <!-- Engine Loader -->
  <script id="engine-loader" type="text/javascript" src="dmloader.js"></script>

  <!-- Engine Setup -->
  <script id="engine-setup" type="text/javascript">
	var extra_params = {
		archive_location_filter: function( path ) {
			return ("archive" + path + "");
		},
		engine_arguments: ["--verify-graphics-calls=false",],
		custom_heap_size: 134217728,
		full_screen_container: "#canvas-container",
		disable_context_menu: true
	}

	Module['INITIAL_MEMORY'] = extra_params.custom_heap_size;

	Module["locateFile"] = function(path, scriptDirectory) {
		if (path == "dmengine.wasm" || path == "dmengine_release.wasm" || path == "dmengine_headless.wasm") {
			path = "MonkeyMart.wasm";
		}
		return scriptDirectory + path;
	};

	var is_iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
	var buttonHeight = 0;
	var prevInnerWidth = -1;
	var prevInnerHeight = -1;

	function resize_game_canvas() {
		if (is_iOS) {
			window.scrollTo(0, 0);
		}
		var app_container = document.getElementById('app-container');
		var game_canvas = document.getElementById('canvas');
		var progress_bar_root = document.getElementById('progress-bar-root');
		var progress_bar_fg = document.getElementById('progress-bar-fg');
		var progress_bar_bg = document.getElementById('progress-bar-bg');
		var innerWidth = window.innerWidth;
		var innerHeight = window.innerHeight - buttonHeight;
		if (prevInnerWidth == innerWidth && prevInnerHeight == innerHeight) {
			return;
		}
		prevInnerWidth = innerWidth;
		prevInnerHeight = innerHeight;
		var width = innerWidth;
		var height = innerHeight;

		app_container.style.width = width + "px";
		app_container.style.height = height + buttonHeight + "px";
		game_canvas.width = width;
		game_canvas.height = height;

		var bar_h = width < height ? width : height;
		progress_bar_bg.width = Math.min(Math.ceil(bar_h * 0.06 * 300/24), width * 0.8);
		progress_bar_bg.style.marginLeft = - progress_bar_bg.width/2 + "px";
		progress_bar_fg.width = Math.ceil(progress_bar_bg.width * 1);
		progress_bar_fg.style.marginTop = (progress_bar_bg.width * 0) * (0)/2 + "px";
		progress_bar_fg.style.marginLeft = -progress_bar_bg.width/2 - progress_bar_fg.width/2 + "px";
		progress_bar_root.style.bottom = Math.ceil(height*0.08 + buttonHeight) + "px";
	}
	resize_game_canvas();
	window.addEventListener('resize', resize_game_canvas, false);
	window.addEventListener('orientationchange', resize_game_canvas, false);
	window.addEventListener("keydown", function(e) {
		if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
			e.preventDefault();
		}
	}, false);
	window.addEventListener('focus', resize_game_canvas, false);

	// HashSHA1 implementation (required for LiveUpdate cleanup)
	!function(){var r=function(r){for(var n="",t=7;t>=0;t--)n+="0123456789abcdef".charAt(r>>4*t&15);return n},n=function(r,n){var t=(65535&r)+(65535&n);return(r>>16)+(n>>16)+(t>>16)<<16|65535&t},e=function(r,n){return r<<n|r>>>32-n},o=function(r,n,t,e){return r<20?n&t|~n&e:r<40?n^t^e:r<60?n&t|n&e|t&e:n^t^e},u=function(r){return r<20?1518500249:r<40?1859775393:r<60?-1894007588:-899497514};window._HashSHA1=function(f){for(var a=function(r){for(var n=1+(r.length+8>>6),t=new Array(16*n),e=0;e<16*n;e++)t[e]=0;for(e=0;e<r.length;e++)t[e>>2]|=r.charCodeAt(e)<<24-e%4*8;return t[e>>2]|=128<<24-e%4*8,t[16*n-1]=8*r.length,t}(f),c=new Array(80),i=1732584193,h=-271733879,v=-1732584194,A=271733878,g=-1009589776,l=0;l<a.length;l+=16){for(var w=i,d=h,y=v,H=A,b=g,s=0;s<80;s++)c[s]=s<16?a[l+s]:e(c[s-3]^c[s-8]^c[s-14]^c[s-16],1),t=n(n(e(i,5),o(s,h,v,A)),n(n(g,c[s]),u(s))),g=A,A=v,v=e(h,30),h=i,i=t;i=n(i,w),h=n(h,d),v=n(v,y),A=n(A,H),g=n(g,b)}return r(i)+r(h)+r(v)+r(A)+r(g)}}();

	var old_preloadAndCallMain = Module._preloadAndCallMain;
	Module._preloadAndCallMain = function () {
		// Delete all LiveUpdate files stored in IDBFS
		var dir = DMSYS.GetUserPersistentDataRoot();
		var resDir = _HashSHA1("MonkeyMart");
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arcd"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arci"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arci.tmp"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.mounts"); } catch (e) {}
		if (Module._archiveLoaded) {}
		old_preloadAndCallMain();
	};
  </script>

  <!-- Engine Start -->
  <script id="engine-start" type="text/javascript">
	var currentPercentage = 0;

	Progress.updateProgress = function(percentage) {
		Progress.notifyListeners(percentage);
		if (currentPercentage > percentage) {
			percentage = currentPercentage;
		}
		currentPercentage = percentage;
		var fg = document.getElementById('progress-bar-fg');
		fg.style.clip = "rect(0px," + fg.width * percentage/100 + "px," + fg.height + "px," + "0px)";
		if (isNaN(percentage)) {
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "hidden";
		}
	};

	Progress.addProgress = function() {
		var progress_bar_root = document.getElementById('progress-bar-root');
		progress_bar_root.style.visibility = "visible";
	};

	Progress.removeProgress = function() {
		var progress_bar_root = document.getElementById('progress-bar-root');
		progress_bar_root.style.visibility = "hidden";
		Module.canvas.style.background = "";
	};

	EngineLoader.stream_wasm = "false" === "true";
	EngineLoader.load("canvas", "MonkeyMart");
  </script>

  <!-- Kasrah SDK Integration - Replaces PokiSDK -->
  <script id="kasrah-sdk-setup" type="text/javascript">
	// ============================================================
	// Kasrah SDK - Full Integration with Monkey Mart (Defold Engine)
	// Features: Ads (Interstitial, Rewarded, Banner), Cloud Save, Analytics
	// ============================================================

	var kasrahSDK = null;
	var kasrahReady = false;

	// Load Kasrah SDK script dynamically
	function loadKasrahSDK() {
		var script = document.createElement('script');
		script.src = "https://kasrah-sdk.onrender.com/sdk/kasrah-sdk.js";
		script.async = true;
		script.onload = function() {
			initKasrahSDK();
		};
		script.onerror = function() {
			console.warn('[Kasrah] Failed to load SDK script, running in offline mode');
			// Fallback: start game without SDK
			startGameWithFallback();
		};
		document.head.appendChild(script);
	}

	// Initialize Kasrah SDK with all features
	async function initKasrahSDK() {
		try {
			if (typeof KasrahSDK === 'undefined') {
				console.warn('[Kasrah] KasrahSDK not defined, running in offline mode');
				startGameWithFallback();
				return;
			}

			const success = await KasrahSDK.init({
				gameId: 'monkeymart',
				callbacks: {
					// Pause game when ad starts
					onAdStart: function() {
						if (Module && Module.pauseMainLoop) {
							Module.pauseMainLoop();
						}
					},
					// Resume game when ad completes
					onAdComplete: function() {
						if (Module && Module.resumeMainLoop) {
							Module.resumeMainLoop();
						}
					},
					// Handle ad errors gracefully
					onAdError: function(data) {
						console.warn('[Kasrah] Ad error:', data);
						if (Module && Module.resumeMainLoop) {
							Module.resumeMainLoop();
						}
					},
					// Gameplay events
					onGameplayStart: function() {
						console.log('[Kasrah] Gameplay started');
					},
					onGameplayStop: function() {
						console.log('[Kasrah] Gameplay stopped');
					},
					onGameLoadingFinished: function() {
						console.log('[Kasrah] Game loading finished');
					}
				}
			});

			if (success) {
				kasrahSDK = KasrahSDK;
				kasrahReady = true;
				console.log('[Kasrah] SDK Ready - All features enabled');

				// Fire gameplayStart event
				kasrahSDK.fireEvent('gameplayStart', { game: 'monkeymart' });

				// Load player cloud save data
				loadPlayerCloudData();

				// Show Banner Ads
				showBannerAds();

				// Track game start analytics
				kasrahSDK.fireEvent('gameStart', { game: 'monkeymart', timestamp: Date.now() });

			} else {
				console.warn('[Kasrah] SDK init returned false, running in offline mode');
			}
		} catch(e) {
			console.error('[Kasrah] Init Error:', e);
		}
	}

	// Show banner ads in top and bottom containers
	function showBannerAds() {
		if (!kasrahSDK) return;

		// Top banner (728x90 for desktop, 320x50 for mobile)
		var topBanner = document.getElementById('kasrah-banner-top');
		if (topBanner) {
			topBanner.style.display = 'block';
			var bannerSize = window.innerWidth >= 728 ? '728x90' : '320x50';
			kasrahSDK.requestBanner('kasrah-banner-top', bannerSize);
		}

		// Bottom banner (320x50)
		var bottomBanner = document.getElementById('kasrah-banner-bottom');
		if (bottomBanner) {
			bottomBanner.style.display = 'block';
			kasrahSDK.requestBanner('kasrah-banner-bottom', '320x50');
		}
	}

	// Load player cloud save data
	async function loadPlayerCloudData() {
		if (!kasrahSDK) return;
		try {
			var savedData = await kasrahSDK.loadData();
			if (savedData) {
				console.log('[Kasrah] Cloud save loaded:', savedData);
				// Store in window for game access
				window._kasrahCloudData = savedData;
			}
		} catch(e) {
			console.warn('[Kasrah] Cloud load error:', e);
		}
	}

	// Fallback when SDK is unavailable
	function startGameWithFallback() {
		console.log('[Kasrah] Running without SDK');
	}

	// ============================================================
	// PokiSDK Integration (Original engine flow - MUST be preserved)
	// Kasrah SDK loads AFTER the game starts via PokiSDK
	// ============================================================

	// Poki banner helpers (kept for compatibility)
	function poki_showBanner(vBanner) {
		if (typeof PokiSDK !== 'undefined') {
			PokiSDK.displayAd(document.getElementById(vBanner), '320x50');
		}
	}

	function poki_showBigBanner(vBanner) {
		if (typeof PokiSDK !== 'undefined') {
			PokiSDK.displayAd(document.getElementById(vBanner), '728x90');
		}
	}

	function poki_hideBanner(vBanner) {
		if (typeof PokiSDK !== 'undefined') {
			PokiSDK.destroyAd(document.getElementById(vBanner));
		}
	}

	// PokiSDK game loading tracking + Kasrah integration
	if (typeof PokiSDK !== 'undefined') {
		PokiSDK.gameLoadingStart();
	}

	var data = {};
	var isLoadFinished = false;

	Progress.addListener(function(percentage) {
		data.percentageDone = percentage / 100;
		if (typeof PokiSDK !== 'undefined' && !isLoadFinished) {
			PokiSDK.gameLoadingProgress(data);
		}
		if (percentage == 100 && !isLoadFinished) {
			if (typeof PokiSDK !== 'undefined') {
				PokiSDK.gameLoadingFinished();
			}
			isLoadFinished = true;
		}
	});

	// CRITICAL: This is the original engine flow - DO NOT modify
	// PokiSDK.init() must resolve before Module.runApp() is called
	Module['onRuntimeInitialized'] = function() {
		if (typeof PokiSDK !== 'undefined') {
			PokiSDK.init().then(function() {
				Module.runApp("canvas", extra_params);
				// Load Kasrah SDK after game starts (3 second delay for stability)
				setTimeout(loadKasrahSDK, 3000);
			}).catch(function() {
				Module.runApp("canvas", extra_params);
				// Load Kasrah SDK even if PokiSDK fails
				setTimeout(loadKasrahSDK, 3000);
			});
		} else {
			// No PokiSDK available - run directly
			Module.runApp("canvas", extra_params);
			setTimeout(loadKasrahSDK, 3000);
		}
	};

	// ============================================================
	// Global Game Hooks - Called by game engine for SDK events
	// ============================================================
	window.KasrahGameHooks = {

		// Called when a level/stage is completed
		onLevelComplete: function(data) {
			if (!kasrahReady || !kasrahSDK) return;
			// Save progress to cloud
			kasrahSDK.saveData(data);
			// Track analytics event
			kasrahSDK.fireEvent('levelComplete', data);
		},

		// Called when game over
		onGameOver: function(data) {
			if (!kasrahReady || !kasrahSDK) return;
			// Save final score to cloud
			kasrahSDK.saveData(data);
			// Track analytics event
			kasrahSDK.fireEvent('gameOver', data);
			// Show interstitial ad on game over
			kasrahSDK.showInterstitial({
				onComplete: function() {
					if (Module && Module.resumeMainLoop) Module.resumeMainLoop();
				},
				onError: function() {
					if (Module && Module.resumeMainLoop) Module.resumeMainLoop();
				}
			});
		},

		// Called when game is paused
		onGamePause: function() {
			if (!kasrahReady || !kasrahSDK) return;
			kasrahSDK.fireEvent('gameplayStop');
		},

		// Called when game is resumed
		onGameResume: function() {
			if (!kasrahReady || !kasrahSDK) return;
			kasrahSDK.fireEvent('gameplayStart');
		},

		// Show interstitial ad (called between levels)
		showInterstitialAd: function(callback) {
			if (kasrahReady && kasrahSDK) {
				kasrahSDK.showInterstitial({
					onComplete: function() { if (callback) callback(); },
					onError: function() { if (callback) callback(); }
				});
			} else {
				if (callback) callback();
			}
		},

		// Show rewarded ad (called when player wants extra lives/coins)
		showRewardedAd: function(onReward, onError) {
			if (kasrahReady && kasrahSDK) {
				kasrahSDK.showRewarded({
					onReward: function() { if (onReward) onReward(); },
					onError: function() { if (onError) onError(); }
				});
			} else {
				if (onError) onError();
			}
		},

		// Save player data to cloud
		savePlayerData: function(data) {
			if (kasrahReady && kasrahSDK) {
				kasrahSDK.saveData(data);
			}
		},

		// Load player data from cloud
		loadPlayerData: function(callback) {
			if (kasrahReady && kasrahSDK) {
				kasrahSDK.loadData().then(function(data) {
					if (callback) callback(data);
				}).catch(function() {
					if (callback) callback(null);
				});
			} else {
				if (callback) callback(null);
			}
		},

		// Track custom analytics event
		trackEvent: function(eventName, data) {
			if (kasrahReady && kasrahSDK) {
				kasrahSDK.fireEvent(eventName, data);
			}
		},

		// Check if SDK is ready
		isReady: function() {
			return kasrahReady;
		}
	};
  </script>
