	/* Disable user selection to avoid strange bug in Chrome on Windows:
	* Selecting a text outside the canvas, then clicking+draging would
	* drag the selected text but block mouse down/up events to the engine.
	*/
	body {
	
		position: fixed; /* Prevent overscroll */
	
		margin:0;
		padding:0;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.canvas-app-container:-webkit-full-screen {
		/* Auto width and height in Safari/Chrome fullscreen. */
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}

	#canvas-container {
		position: relative;
	}

		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);

			path = "MonkeyMart.wasm";

		var progress_bar_bg = document.getElementById('progress-bar-bg');

		var innerHeight = window.innerHeight - buttonHeight;
		if (prevInnerWidth == innerWidth && prevInnerHeight == innerHeight)

			return;
		}

		prevInnerHeight = innerHeight;
		var width = 960;

		height = innerHeight;
	
	
	
		app_container.style.width = width + "px";
		app_container.style.height = height + buttonHeight + "px";
		game_canvas.width = width;
		game_canvas.height = height;

		// progress bar
		var bar_h = width < height ? width:height;
		progress_bar_bg.width = Math.min(Math.ceil(bar_h * 0.06 * 300/24),width * 0.8);

		progress_bar_bg.style.marginLeft = - progress_bar_bg.width/2 + "px";
		progress_bar_fg.width =  Math.ceil(progress_bar_bg.width * 1);

		progress_bar_fg.style.marginTop = (progress_bar_bg.width * 0) * (0)/2 + "px";
		progress_bar_fg.style.marginLeft = -progress_bar_bg.width/2 - progress_bar_fg.width/2 + "px";

		progress_bar_root.style.bottom = Math.ceil(height*0.08 + buttonHeight) + "px";
	}
	resize_game_canvas();
	window.addEventListener('resize', resize_game_canvas, false);

  <script id="engine-start" type="text/javascript">
		var currentPercentage = 0

		Progress.updateProgress = function(percentage) {
			Progress.notifyListeners(percentage);
			if(currentPercentage>percentage){
				percentage = currentPercentage
			}
			currentPercentage = percentage

			var fg = document.getElementById('progress-bar-fg');
			fg.style.clip="rect(0px,"  + fg.width * percentage/100 + "px,"  + fg.height+"px," + "0px)"

			if(isNaN(percentage)){
				var progress_bar_root = document.getElementById('progress-bar-root');
				progress_bar_root.style.visibility = "hidden";
			}
		};
		Progress.addProgress = function (){
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "visible"
		}
		Progress.removeProgress = function () {
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "hidden";
			// Remove any background/splash image that was set in runApp().
			// Workaround for Safari bug DEF-3061.
			Module.canvas.style.background = "";
		}

		EngineLoader.stream_wasm = "false" === "true";
		EngineLoader.load("canvas", "MonkeyMart");
	</script>

  <script type="text/javascript">
    var kasrahSDK = null;
    var levelCount = 0;
    var sessionStartTime = Date.now();

    async function initKasrahSDK() {
      try {
        const success = await KasrahSDK.init({
          gameId: 'monkeymart',
          callbacks: {
            onAdStart: function() {
              if (typeof Module !== 'undefined' && Module.pauseMainLoop) {
                try { Module.pauseMainLoop(); } catch(e) {}
              }
            },
            onAdComplete: function() {
              if (typeof Module !== 'undefined' && Module.resumeMainLoop) {
                try { Module.resumeMainLoop(); } catch(e) {}
              }
            }
          }
        });

        if (success) {
          kasrahSDK = KasrahSDK;
          console.log('[Kasrah SDK] ✅ Initialized');
          await loadCloudSaveData();
          await showBannerAds();
          kasrahSDK.fireEvent('gameplayStart', { game: 'monkeymart' });
        }
      } catch (error) {
        console.error('[Kasrah SDK] Init error:', error);
      }
    }

    async function loadCloudSaveData() {
      if (!kasrahSDK) return;
      try {
        const savedData = await kasrahSDK.loadData();
        if (savedData) {
          if (savedData.coins !== undefined) localStorage.setItem('monkeymart_coins', savedData.coins);
          if (savedData.level !== undefined) localStorage.setItem('monkeymart_level', savedData.level);
        }
      } catch (e) {}
    }

    async function saveCloudData(gameData) {
      if (!kasrahSDK) return;
      try {
        await kasrahSDK.saveData({
          coins: gameData.coins || 0,
          level: gameData.level || 1,
          lastPlayed: new Date().toISOString()
        });
      } catch (e) {}
    }

    async function showBannerAds() {
      if (!kasrahSDK) return;
      try {
        const top = document.getElementById('kasrah-banner-top');
        if (top) {
          top.style.display = 'block';
          await kasrahSDK.requestBanner('kasrah-banner-top', '728x90');
        }
        const bottom = document.getElementById('kasrah-banner-bottom');
        if (bottom) {
          bottom.style.display = 'block';
          await kasrahSDK.requestBanner('kasrah-banner-bottom', '320x50');
        }
      } catch (e) {}
    }

    async function showInterstitialAd(onComplete) {
      if (!kasrahSDK) { if (onComplete) onComplete(); return; }
      try {
        await kasrahSDK.showInterstitial({
          onComplete: onComplete,
          onError: onComplete
        });
      } catch (e) { if (onComplete) onComplete(); }
    }

    async function showRewardedAd(onReward, onError) {
      if (!kasrahSDK) { if (onError) onError(); return; }
      try {
        await kasrahSDK.showRewarded({
          onReward: onReward,
          onError: onError
        });
      } catch (e) { if (onError) onError(); }
    }

    // Defold Runtime Hook
    var old_onRuntimeInitialized = Module['onRuntimeInitialized'];
    Module['onRuntimeInitialized'] = function() {
      if (old_onRuntimeInitialized) old_onRuntimeInitialized();
      setTimeout(initKasrahSDK, 1000);
    };

    // Global Hooks for Game
    window.KasrahGameHooks = {
      onLevelComplete: function(d) { levelCount++; saveCloudData(d); if(levelCount%3===0) showInterstitialAd(); },
      onGameOver: function(d) { saveCloudData(d); showInterstitialAd(); },
      showInterstitialAd: showInterstitialAd,
      showRewardedAd: showRewardedAd
    };
  </script>
